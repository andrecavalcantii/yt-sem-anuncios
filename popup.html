<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; width: 220px; font: 14px system-ui, sans-serif; background: #fff; color: #111; }
    main { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    h1 { margin: 0; font-size: 15px; }
    #estado { margin: 0; color: #555; }
    button {
      border: 0; border-radius: 8px; padding: 10px; font: inherit; font-weight: 600;
      cursor: pointer; color: #fff; background: #c00;
    }
    button.desligado { background: #2a7d2a; }
    label { display: flex; align-items: center; gap: 8px; padding-top: 12px; border-top: 1px solid #ddd; cursor: pointer; }
    input { width: 16px; height: 16px; margin: 0; accent-color: #c00; cursor: pointer; }
    @media (prefers-color-scheme: dark) {
      body { background: #1e1e1e; color: #eee; }
      #estado { color: #aaa; }
      label { border-color: #333; }
    }
  </style>
</head>
<body>
  <main>
    <h1>YT Sem Anúncios</h1>
    <p id="estado">…</p>
    <button id="alternar"></button>
    <label><input type="checkbox" id="shorts"> Esconder Shorts</label>
  </main>
  <script src="popup.js"></script>
</body>
</html>
